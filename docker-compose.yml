name: reloj-checador

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reloj_checador
      POSTGRES_USER: reloj
      POSTGRES_PASSWORD: reloj
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloj -d reloj_checador"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: reloj-checador-postgres-data
